# Example Libranet node configuration.
#
# Every setting below is optional and shown with its default, so an absent
# or empty config file starts a node on these values. Copy this file to the
# platform config location (`libranet --check-config` prints the resolved
# settings; `--config PATH` loads a file from anywhere) and edit what you
# need.
#
# Unknown keys are rejected at startup, so a typo here is an error rather
# than a setting that silently does nothing.

network:
  # Peer-facing listener.
  listen_address: "0.0.0.0"
  listen_port: 8080

  # How this node describes itself in /data/nodes (HTTP API §10.1). With
  # neither address nor port set, it advertises
  # `http://localhost:8080`, meaning "reach me at the address this
  # connection came from". Set external_port when a gateway forwards a
  # different port; set external_address when the node has a stable name.
  external_scheme: "http"
  external_address: null
  external_port: null

  # Seconds a client is told to wait (Retry-After) before asking again for
  # content this node is still retrieving from peers (HTTP API §5.2).
  # Peers are asked for the same content at most once per this period.
  retry_after_seconds: 5

peers:
  # At least one connection per 4-bit identifier bucket
  # (High-Level Design §4.6).
  min_outgoing_connections: 16
  bucket_prefix_bits: 4
  connect_timeout_seconds: 10.0
  request_timeout_seconds: 30.0
  # Provisional: how long a peer's address rests after connecting to it
  # failed, or after the connection to it closed, before it is tried again.
  retry_delay_seconds: 60.0
  # Provisional: how often each connected peer's /data/seek list is fetched
  # again so content it still wants can be pushed (Handshake Protocol §3.3).
  # Keep it under the peers' idle timeout (60 seconds for this
  # implementation) so the connection stays open.
  seek_refresh_seconds: 30.0
  # JSON file of initial peers, used only when this node knows no peers at
  # all. Defaults to the (currently empty) list shipped with the package.
  seed_file: null

storage:
  # Defaults to the platform data directory; the CAS, the SQLite file, and
  # the node keys all live beneath it.
  # data_dir: /var/lib/libranet
  # cache_dir: /var/cache/libranet

  # Leading hash characters used as a subdirectory name, bounding how large
  # any one directory gets.
  hash_prefix_length: 4

  # A single object may not exceed 1 MiB as stored and as sent; compressed
  # content may be larger once decompressed, since the protocol sets no
  # limit on that (High-Level Design §4.3).
  max_object_bytes: 1048576
  # Provisional: how large a node or seek list posted by a peer may be once
  # decompressed. Its 1 MiB limit applies to the bytes sent, so a
  # zlib-compressed list may expand past that (HTTP API §10.6, §10.7.1).
  # The protocol sets no limit here; this is a local safeguard.
  max_decompressed_list_bytes: 4194304

  # Eviction (Step 15) starts handing off low-priority content once free
  # space falls below this.
  min_free_bytes: 1073741824
  max_storage_bytes: null

  # Provisional: how long a cached /data/search result stays valid.
  search_cache_ttl_seconds: 300.0
  # Most hashes a single /data/search response lists (HTTP API §6).
  search_max_results: 32

identity:
  # Defaults to `keys/` under data_dir.
  key_dir: null
  hash_algorithm: "sha256"
  # Provisional: requests trusted while an unknown sender's public key is
  # still being fetched (Step 6).
  provisional_trust_attempts: 3
  # Provisional: the longest a signed message may take to arrive (seconds
  # since its signature was created), and the clock difference tolerated
  # between this node and a peer (HandshakeProtocol §2).
  signature_max_age_seconds: 5.0
  signature_clock_skew_seconds: 30.0
  # Serve reads (GET or HEAD) of the /data API to clients that do not sign
  # their requests. When false, only signing nodes are served there; unsigned
  # reads get 401 Unauthorized. Either way, every signed request is checked
  # and a failed signature closes the connection (HandshakeProtocol §2.1),
  # and uploads (PUT) always require a valid signature.
  allow_unsigned_api_reads: true

stats:
  # How often the plain /data/nodes and /data/seek files are rewritten from
  # the statistics database. Each is replaced only when its contents
  # actually change. Provisional default.
  derive_interval_seconds: 60.0
  # Neither list may reach 1 MiB as sent (HTTP API §10.6, §10.7.1), and this
  # node sends them uncompressed; entries are added best-first until the
  # next one would not fit.
  max_list_bytes: 1048576
  # Provisional: how long content this node asked for and never received
  # stays in the /data/seek list it publishes.
  seek_entry_ttl_seconds: 3600.0

# Directory bundles served as web applications (HTTP API §13), none by
# default. Each is reached at /{name}/ and named by the content id of its
# bundle; the name "/" is the application served at the root, which also
# answers every path no other application's name begins. Names ignore case,
# and data, web, chaos, and config are reserved. Files are resolved from a
# bundle as they are first requested, fetching from peers what this node
# lacks.
applications: {}
#   "/": "sha256/<hash of a directory bundle>"
#   wiki: "sha256/<hash of a directory bundle>"

logging:
  level: "INFO"
  # Defaults to the platform log directory. Each module process writes its
  # own file, e.g. libranet-webserver.log.
  # directory: /var/log/libranet
  file_name: "libranet.log"
  max_bytes: 10485760
  backup_count: 5
  console: true
