# Example Libranet node configuration.
#
# Every setting below is optional and shown with its default, so an absent
# or empty config file starts a node on these values. Copy this file to the
# platform config location (`libranet --check-config` prints the resolved
# settings; `--config PATH` loads a file from anywhere) and edit what you
# need.
#
# Unknown keys are rejected at startup, so a typo here is an error rather
# than a setting that silently does nothing.

network:
  # Peer-facing listener.
  listen_address: "0.0.0.0"
  listen_port: 8080

  # How this node describes itself in /data/nodes (HTTP API §10.1). With
  # neither address nor port set, it advertises
  # `http://localhost:8080`, meaning "reach me at the address this
  # connection came from". Set external_port when a gateway forwards a
  # different port; set external_address when the node has a stable name.
  # No node dials "https" yet, so a node advertising it is reached at
  # http://localhost:{listen_port} instead, which it logs as it starts.
  external_scheme: "http"
  external_address: null
  external_port: null

  # Seconds a client is told to wait (Retry-After) before asking again for
  # content this node is still retrieving from peers (HTTP API §5.2).
  # Peers are asked for the same content at most once per this period.
  retry_after_seconds: 5

  # Seconds a request for an application's file waits for content this node
  # lacks, the file's entry or its parts, before it is answered 503 (HTTP
  # API §13.2), since a <video> element does not retry a 503. Once the file
  # has begun to be sent, a part that does not come within as long ends it
  # short. 0 answers at once.
  app_wait_seconds: 10.0

  # The most a page may ask this node to spend making a drop (HTTP API
  # §9.6): seconds searching for its nonce, and how many leading bits the
  # drop's hash must share with its target's however long that takes. Each
  # bit more doubles the search, on average; 26 bits takes this node tens
  # of seconds on one core. A request asking for more is refused. One search
  # runs at a time, and the rest wait their turn.
  drop_max_seconds: 60.0
  drop_max_minimum_bits: 26

  # How long a person's session lasts unused before it ends, in seconds
  # (HTTP API §11.4). The node holds the person's private key in memory for
  # as long as the session lasts. Signing out, or the node stopping, ends a
  # session sooner.
  session_idle_seconds: 86400.0

  # The hosts /config is served as. A /config request whose Host header
  # names any other host is refused, so that a site which points a name of
  # its own at this machine cannot use a browser here to reach /config
  # (HTTP API §2.3.3). Add the name you reach /config by if it is none of
  # these, through a reverse proxy for example. Shell-style patterns,
  # whatever their case, matched against the host without its port; write an
  # IPv6 address without brackets. "*" serves /config as any host, which
  # turns the check off. The list replaces the default, not adds to it.
  config_hosts:
    - "localhost"
    - "127.0.0.1"
    - "::1"

  # The port /config listens on, at 127.0.0.1 alone, kept apart from
  # listen_port so that no application this node serves shares an origin
  # with /config (HTTP API §2.3). null takes listen_port + 100, or the next
  # 100 up that is free (8180, then 8280, and so on), so nodes on one
  # machine have theirs at predictable ports; the node logs the one it took.
  # A port set here is the only one tried.
  config_port: null

peers:
  # At least one connection per 4-bit identifier bucket
  # (High-Level Design §4.6).
  min_outgoing_connections: 16
  bucket_prefix_bits: 4
  # Then one connection per 4-bit bucket among neighbors: peers whose
  # identifiers start in this node's own bucket, bucketed by the bits that
  # follow. While too few buckets have a peer, any peers make up the number
  # of both sets together. 0 turns this second set off.
  min_neighborhood_connections: 16
  neighborhood_prefix_bits: 4
  connect_timeout_seconds: 10.0
  request_timeout_seconds: 30.0
  # Provisional: how long a peer rests after connecting to it failed at
  # every address known for it, or after the connection to it closed, before
  # it is tried again.
  retry_delay_seconds: 60.0
  # Provisional: how often each connected peer's /data/seek list is fetched
  # again so content it still wants can be pushed (Handshake Protocol §3.3).
  # It must be under the peers' idle timeout (60 seconds for this
  # implementation) so the connection stays open.
  seek_refresh_seconds: 30.0
  # How many passes a search of the connected peers for content makes before
  # it gives up: each pass after the first asks every peer again, once the
  # Retry-After it gave has passed (High-Level Design §4.7). At least 2. More
  # may help a large network, but each pass asks every peer once more.
  search_passes: 3
  # Provisional: once a search of the connected peers for content has found
  # nothing, how long before asking for it again starts another. Keep it
  # longer than peers' searches last, any Retry-After they send times their
  # search_passes less one (High-Level Design §4.7), or searches for content
  # no node holds restart each other for ever. A node refuses to start with a
  # hold no longer than its own search_passes less one, times its
  # network.retry_after_seconds.
  failed_search_hold_seconds: 300.0
  # JSON file of initial peers, used only when this node knows no peers at
  # all. Defaults to the (currently empty) list shipped with the package.
  seed_file: null
  # Look up names (reverse DNS) for the addresses peers connect from, and
  # try each name found as another address for that peer: a name can
  # outlast an address. Each lookup tells your DNS resolver an address this
  # node talks to.
  reverse_dns: true
  # Provisional: how long a name found for an address, or finding none, is
  # remembered before the address is looked up again.
  reverse_dns_cache_seconds: 3600.0

storage:
  # Defaults to the platform data directory; the CAS, the SQLite file, and
  # the node keys all live beneath it.
  # data_dir: /var/lib/libranet
  # cache_dir: /var/cache/libranet

  # Leading hash characters used as a subdirectory name, bounding how large
  # any one directory gets.
  hash_prefix_length: 4

  # A single object may not exceed 1 MiB as stored and as sent; compressed
  # content may be larger once decompressed, since the protocol sets no
  # limit on that (High-Level Design §4.3). It may be lowered, never raised.
  max_object_bytes: 1048576
  # Provisional: how large a node or seek list posted by a peer may be once
  # decompressed. Its 1 MiB limit applies to the bytes sent, so a
  # zlib-compressed list may expand past that (HTTP API §10.6, §10.7.1).
  # The protocol sets no limit here; this is a local safeguard.
  max_decompressed_list_bytes: 4194304

  # Content is handed off to another node and then deleted here whenever
  # free space on the disk holding it falls below min_free_bytes (0 turns
  # that off), or the content held grows past max_storage_bytes (null for no
  # limit). What goes first is what has gone unused longest, been requested
  # least, is smallest, and shares the fewest leading bits with this node's
  # id, all four weighed together (High-Level Design §4.5). Resolved
  # application files are not counted.
  min_free_bytes: 1073741824
  max_storage_bytes: null
  # Before any content is handed off for want of free space, the resolved
  # files of every application not used for this long (30 days) are deleted.
  # They are resolved from the application's bundle again when next asked
  # for.
  resolved_idle_seconds: 2592000.0

  # Provisional: how long a cached /data/search result stays valid.
  search_cache_ttl_seconds: 300.0
  # Most hashes a single /data/search response lists (HTTP API §6).
  search_max_results: 32

  # Zip files of CAS objects, each named `{algorithm}/{hash}`, served after
  # the content stored here and before those shipped with the package. Their
  # content is never evicted, nor counted against the limits above. One that
  # cannot be opened stops the node.
  archives: []

identity:
  # Defaults to `keys/` under data_dir.
  key_dir: null
  hash_algorithm: "sha256"
  # Provisional: requests trusted while an unknown sender's public key is
  # still being fetched (Step 6). At least 2, since first contact needs two
  # requests to exchange keys (Handshake Protocol §3.2).
  provisional_trust_attempts: 3
  # Provisional: the longest a signed message may take to arrive (seconds
  # since its signature was created), and the clock difference tolerated
  # between this node and a peer (HandshakeProtocol §2).
  signature_max_age_seconds: 5.0
  signature_clock_skew_seconds: 30.0
  # Serve reads (GET or HEAD) of the /data API to clients that do not sign
  # their requests. When false, only signing nodes are served there; unsigned
  # reads get 401 Unauthorized. Either way, every signed request is checked
  # and a failed signature closes the connection (HandshakeProtocol §2.1),
  # and uploads (PUT) always require a valid signature.
  allow_unsigned_api_reads: true
  # The sizes, in bits, a person's RSA key may be made at on this node (HTTP
  # API §11.3), which a page offers as quick, stronger, and strongest. A
  # larger key takes longer to make: under a second at 4096 bits, on
  # average, on a recent laptop. None may be under 2048.
  person_key_bits: [2048, 3072, 4096]

stats:
  # How often the plain /data/nodes and /data/seek files are rewritten from
  # the statistics database. Each is replaced only when its contents
  # actually change. Provisional default.
  derive_interval_seconds: 60.0
  # Neither list may reach 1 MiB as sent (HTTP API §10.6, §10.7.1), and this
  # node sends them uncompressed; entries are added best-first until the
  # next one would not fit. It may be lowered, never raised.
  max_list_bytes: 1048576
  # Provisional: how long content this node asked for and never received
  # stays in the /data/seek list it publishes.
  seek_entry_ttl_seconds: 3600.0
  # Provisional: the most addresses kept for any one peer. Past it, those
  # that have never worked are forgotten first, relayed ones before the rest.
  max_addresses_per_node: 16
  # Provisional: an address that has never worked is forgotten once this
  # many attempts in a row to reach its peer there have failed. One that has
  # worked is kept however often it fails, so a peer that is offline for a
  # while is not forgotten.
  max_address_failures: 5
  # Provisional: a peer is given up on once this many attempts in a row to
  # reach it, at every address known for it, have failed. It is not dialed
  # for node_cool_off_seconds (a day), then it is tried once more. Reaching
  # it, or the peer connecting to this node, starts the count again.
  max_node_failures: 5
  node_cool_off_seconds: 86400.0

backup:
  # Provisional: how often each backup job's directory is looked at for
  # changes, for a job configured through /config without an
  # interval_seconds of its own. Looking walks the directory once, reading
  # only files whose metadata changed, and makes a new backup only if content
  # changed; a change to metadata alone waits for the next one.
  interval_seconds: 3600.0
  # A backup, or a build through /config, stores only the entries that
  # changed, as a layer over the bundle before, until this many layers lie
  # above the last bundle stored whole; the next is stored whole again.
  # 0 stores every one whole.
  max_update_layers: 32
  # Provisional: a restore waiting on content it lacks gives up, and fails,
  # once this long passes with none of that content arriving. Asking for the
  # same restore again carries it on where it left off.
  restore_stall_seconds: 86400.0
  # Provisional: a backup, build, or import waits, before storing more, while
  # storage is full, and gives up, and fails, once it has stayed full this
  # long, as when no peer takes what is handed off. The next look at a
  # backup job carries on from what was stored.
  storage_stall_seconds: 3600.0
  # Extended attributes a backup or build leaves out, and a restore does not
  # set: shell-style patterns, case sensitive. These describe the local copy
  # rather than the content on macOS, or on Linux are namespaces only a
  # privileged user may set. The list replaces the default, not adds to it.
  excluded_xattrs:
    - "com.apple.quarantine"
    - "com.apple.lastuseddate#PS"
    - "com.apple.macl"
    - "com.apple.provenance"
    - "com.apple.metadata:kMDLabel_*"
    - "security.*"
    - "system.*"
    - "trusted.*"

local:
  # The folders on this machine that a browser on it may list, and import
  # files from, through /data/directory (HTTP API §12.2). Nothing outside
  # them is offered, nor anything hidden within them. Each is offered under
  # its own name, the last segment of its path, so no two may share one, and
  # one that does not exist is left out. A leading ~ is the home directory.
  # The default is the user's own desktop, documents, downloads, music,
  # pictures, and videos folders: on macOS those below, and on Linux those
  # the XDG user directories name (user-dirs.dirs), ~/Videos and the like
  # where they name none. The list replaces the default, not adds to it; []
  # offers none.
  folders:
    - "~/Desktop"
    - "~/Documents"
    - "~/Downloads"
    - "~/Music"
    - "~/Pictures"
    - "~/Movies"

# Applications are not configured here. Which directory bundle each one
# serves is changed while the node runs, through /config/api/applications,
# and kept in applications.json under data_dir.

logging:
  level: "INFO"
  # Defaults to the platform log directory. Each module process writes its
  # own file, e.g. libranet-webserver.log.
  # directory: /var/log/libranet
  file_name: "libranet.log"
  max_bytes: 10485760
  backup_count: 5
  console: true
  # The layout of each log line, as Python's logging module formats it.
  format: "%(asctime)s %(levelname)-8s %(name)-24s %(message)s"
