# gcovr's settings, read when it runs from this directory after a coverage
# build has run the tests. See "Coverage" in README.md.

# The libraries and the program, not their tests.
filter = src/
exclude = src/.*/tests/

# The branches the compiler adds for exceptions, and those it can show never
# run, are not the code's own decisions.
exclude-throw-branches = yes
exclude-unreachable-branches = yes

print-summary = yes

# gcovr exits with status 2 when the lines the tests run fall below this
# percent. Only lines are held to a floor: branch counts differ widely from
# one compiler to another, for the same code and tests.
fail-under-line = 80
