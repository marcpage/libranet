name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Python implementation, run from its own directory.
defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: black
        run: uv run black --check --diff .

      - name: flake8
        run: uv run flake8

      - name: mypy
        run: uv run mypy

      - name: pylint
        run: uv run pylint src tests hatch_build.py

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Oldest supported (requires-python) and newest.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: python/coverage.xml
          if-no-files-found: ignore

      - name: Example config validates
        run: uv run libranet --config examples/libranet.yaml --check-config

  # The C++ implementation, run from its own directory. It is built for
  # Debug, instrumented for coverage, for Release, and twice more for Debug
  # with sanitizers; the tests of the Debug builds are run. On Ubuntu, its
  # parsers are fuzzed as well. gcovr reads its settings, and the floor below
  # which the job fails, from cpp/gcovr.cfg. The program itself is built but
  # not run: it is to be a server.
  cpp:
    name: C++ build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install Conan, Ninja, and gcovr
        run: |
          uv tool install "conan>=2,<3"
          uv tool install ninja
          uv tool install "gcovr==8.*"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Conan profile
        run: conan profile detect --exist-ok

      - name: Build for Debug, with coverage
        run: |
          conan install . -s build_type=Debug --build=missing
          cmake --preset conan-debug -DLIBRANET_COVERAGE=ON
          cmake --build --preset conan-debug

      # Some warnings, such as GCC's -Wnull-dereference, need the optimizer.
      - name: Build for Release
        run: |
          conan install . --build=missing
          cmake --preset conan-release
          cmake --build --preset conan-release

      # AddressSanitizer and ThreadSanitizer cannot share a build, so each
      # has one of its own. UndefinedBehaviorSanitizer runs with
      # AddressSanitizer only: GCC's checks of an object's type probe memory
      # through pipes that ThreadSanitizer sees opened but not closed, and
      # reports as races between threads. On Linux, AddressSanitizer finds
      # leaks too. Both use the Debug build's Conan files.
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          cmake -S . -B build/address -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            --toolchain "$PWD/build/Debug/generators/conan_toolchain.cmake" \
            -DLIBRANET_SANITIZERS=address,undefined
          cmake --build build/address

      - name: Build with ThreadSanitizer
        run: |
          cmake -S . -B build/thread -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            --toolchain "$PWD/build/Debug/generators/conan_toolchain.cmake" \
            -DLIBRANET_SANITIZERS=thread
          cmake --build build/thread

      # libFuzzer comes with LLVM's Clang, which Ubuntu has, and not with
      # Apple's, so only Ubuntu fuzzes. The fuzzers build without the tests,
      # but the crypto library needs OpenSSL 3.2 or newer, for Argon2id, which
      # is newer than Ubuntu's: it comes from the Debug build's Conan files.
      - name: Build fuzzers
        if: runner.os == 'Linux'
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            --toolchain "$PWD/build/Debug/generators/conan_toolchain.cmake" \
            -DBUILD_TESTING=OFF -DLIBRANET_FUZZERS=ON \
            -DLIBRANET_SANITIZERS=address,undefined
          cmake --build build/fuzz

      - name: Test
        run: ctest --preset conan-debug --output-on-failure

      # Apple's Clang has no LeakSanitizer, so on macOS each test program
      # runs again under leaks, which lists the memory nothing points to when
      # the program ends, with the stack that allocated each block. It exits
      # with status 1 when it finds any, and above 1 when it cannot look.
      - name: Find leaks
        if: runner.os == 'macOS'
        run: |
          failed=0
          for tests in build/Debug/src/*/*_tests; do
            name=$(basename "$tests")
            report="build/$name.leaks"
            status=0
            leaks --atExit -- "$tests" > "$report" 2>&1 || status=$?
            case "$status" in
              0)
                echo "$name: no leaks"
                ;;
              1)
                echo "::error::$name leaks memory"
                awk '/^leaks Report/ { found = 1 } found && shown < 80 { print; shown++ }' "$report"
                failed=1
                ;;
              *)
                echo "::error::leaks could not check $name (status $status)"
                tail -n 20 "$report"
                failed=1
                ;;
            esac
          done
          exit "$failed"

      # Some sanitizer runtimes fail as a program starts when Linux spreads
      # memory over 32 bits of random addresses, as recent Ubuntu does. 28
      # bits was the default before.
      - name: Address randomization the sanitizers can run with
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Test with AddressSanitizer and UndefinedBehaviorSanitizer
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/address --output-on-failure

      - name: Test with ThreadSanitizer
        run: ctest --test-dir build/thread --output-on-failure

      # Every fuzzer runs for two minutes, all at once. One that finds a
      # fault stops, shows the end of its log here, and saves the input that
      # caused it in build/fuzz/findings/, which the next step uploads.
      - name: Fuzz
        if: runner.os == 'Linux'
        env:
          ASAN_OPTIONS: detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          mkdir -p build/fuzz/findings
          names=()
          pids=()
          for fuzzer in build/fuzz/src/*/*_fuzzer; do
            name=$(basename "$fuzzer")
            mkdir -p "build/fuzz/corpus/$name"
            "$fuzzer" -max_total_time=120 -timeout=10 \
              -artifact_prefix="build/fuzz/findings/$name-" \
              "build/fuzz/corpus/$name" > "build/fuzz/$name.log" 2>&1 &
            names+=("$name")
            pids+=("$!")
          done
          failed=0
          for index in "${!pids[@]}"; do
            name=${names[$index]}
            if wait "${pids[$index]}"; then
              echo "$name: no faults"
            else
              echo "::error::$name found a fault"
              tail -n 60 "build/fuzz/$name.log"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload fuzzing findings
        if: ${{ failure() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v6
        with:
          name: fuzz-findings
          path: cpp/build/fuzz/findings/
          if-no-files-found: ignore

      # gcov must match the compiler: GCC's on Ubuntu, LLVM's for Apple's
      # Clang on macOS.
      - name: Coverage
        env:
          GCOV: ${{ runner.os == 'macOS' && 'xcrun llvm-cov gcov' || 'gcov' }}
        run: >-
          gcovr --txt --cobertura coverage.xml
          --markdown-summary coverage.md
          --markdown-title "C++ coverage (${{ matrix.os }})"

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('cpp/coverage.md') != '' }}
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-cpp-${{ matrix.os }}
          path: cpp/coverage.xml
          if-no-files-found: ignore

  # clang-format and clang-tidy, at the LLVM version cpp/README.md names.
  # This job builds and tests nothing; the cpp jobs do that. clang-tidy reads
  # the compile commands CMake writes when it configures, and cannot read the
  # GCC-only warning options of a GCC configuration, so this job configures
  # with Clang, and with the fuzzers, so that both check their code too.
  # cppcheck, at the version cpp/README.md names, reads the same compile
  # commands.
  cpp-lint:
    name: C++ format, clang-tidy, and cppcheck
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install Conan, Ninja, clang-format, clang-tidy, and cppcheck
        run: |
          uv tool install "conan>=2,<3"
          uv tool install ninja
          uv tool install "clang-format==23.1.*"
          uv tool install "clang-tidy==23.1.*"
          uv tool install "cppcheck==1.5.3"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: clang-format
        run: git ls-files -z '*.cpp' '*.h' '*.hpp' | xargs -0 clang-format --dry-run --Werror

      - name: Conan profile
        run: conan profile detect --exist-ok

      - name: Configure
        run: |
          conan install . --build=missing
          cmake --preset conan-release -DLIBRANET_FUZZERS=ON

      - name: clang-tidy
        run: run-clang-tidy.py -p build/Release -quiet

      # cppcheck does not know the compiler's own macros, and without one
      # naming a platform, ISocket.cpp stops at its #error.
      - name: cppcheck
        run: >-
          cppcheck --project=build/Release/compile_commands.json -D__linux__
          --enable=all --inconclusive --check-level=exhaustive
          --library=googletest --inline-suppr
          --suppressions-list=cppcheck-suppressions.txt
          --error-exitcode=1 --quiet

  # CodeQL, GitHub's code scanning, on each language in the repository, with
  # its fullest standard set of queries. Its alerts go to the repository's
  # Security tab, and to a CodeQL check on each pull request; this job fails
  # only when the analysis cannot run. Every language, C++ included, is read
  # as it is, without a build, so that CodeQL can build an overlay database
  # and analyse only what a pull request changes. Reading without a build
  # also lets it leave out the C++ tests in each library's tests/ directory.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          config: |
            paths-ignore:
              - cpp/src/*/tests
              - python/tests/*

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
