name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The Python implementation, run from its own directory.
defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: black
        run: uv run black --check --diff .

      - name: flake8
        run: uv run flake8

      - name: mypy
        run: uv run mypy

      - name: pylint
        run: uv run pylint src tests hatch_build.py

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Oldest supported (requires-python) and newest.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: pytest
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: python/coverage.xml
          if-no-files-found: ignore

      - name: Example config validates
        run: uv run libranet --config examples/libranet.yaml --check-config

  # The C++ implementation, run from its own directory. It is built for
  # Debug, instrumented for coverage, and its tests are run. gcovr reads its
  # settings, and the floor below which the job fails, from cpp/gcovr.cfg.
  # The program itself is built but not run: it is to be a server.
  cpp:
    name: C++ build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Install Conan, Ninja, and gcovr
        run: |
          uv tool install "conan>=2,<3"
          uv tool install ninja
          uv tool install "gcovr==8.*"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Conan profile
        run: conan profile detect --exist-ok

      - name: Build
        run: |
          conan install . -s build_type=Debug --build=missing
          cmake --preset conan-debug -DLIBRANET_COVERAGE=ON
          cmake --build --preset conan-debug

      - name: Test
        run: ctest --preset conan-debug --output-on-failure

      # gcov must match the compiler: GCC's on Ubuntu, LLVM's for Apple's
      # Clang on macOS.
      - name: Coverage
        env:
          GCOV: ${{ runner.os == 'macOS' && 'xcrun llvm-cov gcov' || 'gcov' }}
        run: >-
          gcovr --txt --cobertura coverage.xml
          --markdown-summary coverage.md
          --markdown-title "C++ coverage (${{ matrix.os }})"

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('cpp/coverage.md') != '' }}
        run: cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-cpp-${{ matrix.os }}
          path: cpp/coverage.xml
          if-no-files-found: ignore

  # clang-format and clang-tidy, at the LLVM version cpp/README.md names.
  # This job builds and tests nothing; the cpp jobs do that. clang-tidy reads
  # the compile commands CMake writes when it configures, and cannot read the
  # GCC-only warning options of a GCC configuration, so this job configures
  # with Clang.
  cpp-lint:
    name: C++ format and clang-tidy
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    defaults:
      run:
        working-directory: cpp
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Install Conan, Ninja, clang-format, and clang-tidy
        run: |
          uv tool install "conan>=2,<3"
          uv tool install ninja
          uv tool install "clang-format==23.1.*"
          uv tool install "clang-tidy==23.1.*"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: clang-format
        run: git ls-files -z '*.cpp' '*.h' '*.hpp' | xargs -0 clang-format --dry-run --Werror

      - name: Conan profile
        run: conan profile detect --exist-ok

      - name: Configure
        run: |
          conan install . --build=missing
          cmake --preset conan-release

      - name: clang-tidy
        run: run-clang-tidy.py -p build/Release -quiet
