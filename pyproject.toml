# Each implementation of Libranet has a directory of its own. The Python one,
# in python/, is a member of this uv workspace, so that `uv sync` and
# `uv run libranet` work from the top of the repository. Its tools keep their
# settings in python/pyproject.toml, and run from there:
# `uv run --directory python pytest`.
[tool.uv.workspace]
members = ["python"]
