[project]
name = "libranet"
version = "0.1.0"
description = "A decentralized peer-to-peer content network that runs over ordinary HTTP"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.1",
    "http-message-signatures>=2.0.1",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
libranet = "libranet.supervisor:main"

[project.urls]
Homepage = "https://github.com/marcpage/libranet"

[dependency-groups]
dev = [
    "black>=24.4",
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=7.1.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libranet"]
# A wheel carries the applications the node ships built, not their directories.
exclude = ["/src/libranet/applications/*/"]

# hatch_build.py builds them with the package's own bundle library.
[tool.hatch.build.targets.wheel.hooks.custom]
require-runtime-dependencies = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
# http-message-signatures ships py.typed but is only partly annotated.
untyped_calls_exclude = ["http_message_signatures"]

[[tool.mypy.overrides]]
module = "http_message_signatures.*"
implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests import the scripts, which are not part of the package.
pythonpath = ["scripts"]
addopts = "-q"

[tool.coverage.run]
source = ["libranet"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
